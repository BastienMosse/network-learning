name: Build & release desktop app

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Network Learning ${{ github.ref_name }}"
          releaseBody: |
            ## Installation

            | Plateforme | Installer | Désinstaller |
            |---|---|---|
            | **Windows** (.msi) | Lancer le `.msi`, suivre l'assistant | Paramètres → Applications → Network Learning → Désinstaller |
            | **Linux** (.deb) | `sudo dpkg -i network-learning_*.deb` | `sudo apt remove network-learning` |
            | **Linux** (.AppImage) | `chmod +x` le fichier puis le lancer | Supprimer le fichier |
          releaseDraft: false
          prerelease: false
