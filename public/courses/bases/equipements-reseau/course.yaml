id: equipements-reseau
slug: equipements-reseau
title: Équipements réseau - Hub, Bridge, Switch et Routeur
description: Comprendre le rôle et les différences entre un hub, un bridge, un switch et un routeur, ainsi que les couches OSI et les adresses utilisées.
level: Débutant
duration: 40 min
themeId: bases
color: blue
objectives:
  - Comprendre le rôle d'un hub, d'un bridge, d'un switch et d'un routeur
  - Savoir différencier les couches OSI 1, 2 et 3
  - Comprendre la différence entre adresse MAC et adresse IP
  - Savoir ce qu'est une table MAC et une table de routage
  - Savoir quel équipement utiliser pour connecter des appareils ou des réseaux différents

sections:

  # ============================================================
  # 01 - LES BASES
  # ============================================================

  - id: bases
    title: Les équipements réseau
    kicker: 01 / Fondations
    blocks:

      - type: text
        title: À quoi servent-ils ?
        content: |
          Les équipements réseau permettent de faire circuler des données entre différents appareils.
          Ils n'ont cependant pas tous le même rôle : certains transmettent simplement les signaux, d'autres choisissent à quel appareil envoyer les données, et d'autres encore permettent de communiquer entre plusieurs réseaux.

          Les quatre équipements à connaître sont :

          - **Hub** : répète les données vers tous les ports
          - **Bridge** : relie et filtre deux segments d'un réseau
          - **Switch** : connecte plusieurs appareils et transmet les données vers le bon port
          - **Routeur** : relie plusieurs réseaux différents

      - type: text
        title: Le repère avec le modèle OSI
        content: |
          Ces équipements se situent principalement dans les trois premières couches du modèle OSI :

          - **Couche 1 - Physique** → Hub
          - **Couche 2 - Liaison de données** → Bridge et Switch
          - **Couche 3 - Réseau** → Routeur

          Plus on monte dans les couches, plus l'équipement prend en compte des informations permettant de prendre des décisions sur la destination des données.

  # ============================================================
  # 02 - LE HUB
  # ============================================================

  - id: hub
    title: Le Hub
    kicker: 02 / Couche 1
    blocks:

      - type: text
        title: Définition
        content: |
          Un **hub** est un équipement réseau très simple permettant de connecter plusieurs appareils.

          Lorsqu'il reçoit un signal sur un port, il le **répète sur tous les autres ports**.
          Il ne cherche pas à déterminer quel appareil est réellement le destinataire.

          Le hub est équivalent à un simple bus : il ne fait que répéter les signaux électriques sur tous les appareils connectés.
          Il sature le réseau et provoque des collisions lorsque plusieurs appareils tentent de transmettre en même temps.

      - type: text
        title: Exemple
        content: |
          Si le PC A envoie des données au PC C, le hub reçoit le signal sur son port et le répète vers tous les autres ports.
          Le hub transmet donc les données à tout le monde, même si un seul appareil est réellement concerné.

      - type: text
        title: Caractéristiques
        content: |
          - Fonctionne en **couche 1 - Physique**
          - Travaille avec les **signaux et les bits**
          - Ne connaît pas les adresses MAC
          - Répète les données sur tous les ports
          - La bande passante est partagée
          - Peut provoquer des collisions
          - Est aujourd'hui largement **obsolète**

          À retenir : **HUB = répète partout**
      

      - type: demo
        title: Le hub répète partout
        intro: PC A envoie une trame destinée uniquement à PC C.
        network:
          nodes:
            - id: hub
              label: Hub
              kind: device
              position: { x: 50, y: 20 }
            - id: pc-a
              label: PC A
              kind: device
              position: { x: 14, y: 80 }
            - id: pc-b
              label: PC B
              kind: device
              position: { x: 38, y: 80 }
            - id: pc-c
              label: PC C
              kind: device
              position: { x: 62, y: 80 }
            - id: pc-d
              label: PC D
              kind: device
              position: { x: 86, y: 80 }
          connections:
            - from: pc-a
              to: hub
            - from: pc-b
              to: hub
            - from: pc-c
              to: hub
            - from: pc-d
              to: hub
        steps:
          - title: Demo Hub
            panel: Demo Hub
            description: Demo Hub.
            active: []

          - title: PC A envoie une trame pour PC C
            panel: Trame destinée à PC C uniquement
            description: PC A veut communiquer uniquement avec PC C. Il envoie sa trame sur le câble qui le relie au hub.
            active: [pc-a]

          - title: Le hub reçoit le signal
            panel: Aucune analyse, aucune table
            description: Le hub reçoit le signal électrique sur son port. Il ne lit aucune adresse et ne sait pas qui est réellement concerné.
            active: [pc-a, hub]
            packets:
              - - from: pc-a
                  to: hub
                  keep: true

          - title: Le hub répète vers tous les ports
            panel: Diffusion vers tous les ports
            description: Le hub répète purement et simplement le signal sur tous les autres ports, y compris ceux de PC B et PC D, qui ne sont pourtant pas concernés.
            active: [hub, pc-b, pc-c, pc-d]
            packets:
              - - from: hub
                  to: pc-b
                  keep: true
                - from: hub
                  to: pc-c
                  keep: true
                - from: hub
                  to: pc-d
                  keep: true

          - title: PC B et PC D reçoivent aussi la trame
            panel: Trame reçue puis ignorée
            description: PC B et PC D reçoivent la trame, l'examinent, constatent qu'elle ne leur est pas destinée et l'ignorent. La bande passante a été utilisée inutilement pour eux.
            active: [pc-b, pc-d]

          - title: Seul PC C traite réellement la trame
            panel: Trame traitée par le destinataire
            description: Seul PC C, le destinataire réel, traite la trame. Le hub n'a fait aucune différence entre les appareils.
            active: [pc-c]

  # ============================================================
  # 03 - LE BRIDGE
  # ============================================================

  - id: bridge
    title: Le Bridge
    kicker: 03 / Couche 2
    blocks:

      - type: text
        title: Définition
        content: |
          Un **bridge**, ou pont réseau, permet de **relier deux segments d'un même réseau**.

          Contrairement au hub, il peut analyser les trames et décider si elles doivent être transmises d'un segment à l'autre.
          Il laissera passer toutes les trames dont la destination est inconnue.

      - type: text
        title: Le rôle des adresses MAC
        content: |
          Le bridge fonctionne avec les **adresses MAC**.

          Il apprend quelles adresses MAC se trouvent de chaque côté du pont.
          Il peut alors filtrer certaines trames et éviter de transmettre inutilement des données.

          Si PC A communique avec PC B et que le bridge sait que PC B se trouve sur le même segment, il peut empêcher la trame de traverser vers le deuxième segment.

          Il apprend les adresses MAC en observant le trafic qui traverse ses ports.
          Il regarde l'émetteur de chaque trame et note de quel segment provient le paquet.
          Il construit ainsi une **table d'apprentissage** qui lui permet de savoir sur quel segment se trouve chaque appareil.

      - type: text
        title: Caractéristiques
        content: |
          - Fonctionne en **couche 2 - Liaison de données**
          - Utilise les **adresses MAC**
          - Relie principalement deux segments
          - Peut filtrer les **trames**
          - Réduit le trafic inutile
          - Constitue le principe de base du switch

          À retenir : **BRIDGE = filtre les trames**
      
# ---------- Démo 1 : remplissage de la table d'apprentissage MAC ----------

      - type: demo
        title: Le bridge apprend les deux segments
        intro: Le bridge observe le trafic et construit sa table au fur et à mesure.
        network:
          nodes:
            - id: bridge
              label: Bridge
              kind: device
              position: { x: 50, y: 50 }
            - id: hub-1
              label: Hub
              kind: device
              position: { x: 32, y: 50 }
            - id: pc-a
              label: PC A
              kind: device
              position: { x: 15, y: 70 }
            - id: pc-b
              label: PC B
              kind: device
              position: { x: 15, y: 30 }
            - id: hub-2
              label: Hub
              kind: device
              position: { x: 68, y: 50 }
            - id: pc-c
              label: PC C
              kind: device
              position: { x: 85, y: 70 }
            - id: pc-d
              label: PC D
              kind: device
              position: { x: 85, y: 30 }
          segments:
            - id: segment-1
              label: Segment 1
              x: 3
              y: 10
              width: 44
              height: 80
              color: teal
            - id: segment-2
              label: Segment 2
              x: 53
              y: 10
              width: 44
              height: 80
              color: coral
          connections:
            - from: pc-a
              to: hub-1
            - from: pc-b
              to: hub-1
            - from: hub-1
              to: bridge
            - from: pc-c
              to: hub-2
            - from: pc-d
              to: hub-2
            - from: hub-2
              to: bridge
        steps:
          - title: La table du bridge est vide
            panel: Table du bridge
            description: Au démarrage, le bridge ne sait pas sur quel segment se trouve chaque appareil. Il va l'apprendre en observant le trafic qui traverse chaque port.
            active: [bridge]
            table:
              headers: [Adresse MAC, Segment]
              rows: 
                - ["-", "-"]
                - ["-", "-"]
                - ["-", "-"]
                - ["-", "-"]

          - title: PC A émet une trame vers PC B
            panel: Apprentissage - PC A sur le segment 1
            description: PC A émet une trame. Elle traverse le hub 1, qui la diffuse vers PC B et vers le bridge. Le bridge note que PC A se trouve sur le segment 1.
            active: [pc-a, hub-1, bridge]
            packets:
              - - from: pc-a
                  to: hub-1
              - - from: hub-1
                  to: bridge
                - from: hub-1
                  to: pc-b
                  keep: true
              - - from: bridge
                  to: hub-2
              - - from: hub-2
                  to: pc-c
                  keep: true
                - from: hub-2
                  to: pc-d
                  keep: true
            table:
              headers: [Adresse MAC, Segment]
              rows:
                - ["PC A", "Segment 1"]
                - ["-", "-"]
                - ["-", "-"]
                - ["-", "-"]

          - title: PC B émet à son tour vers PC A
            panel: Apprentissage - PC B sur le segment 1
            description: PC B émet une trame, relayée par le hub 1 jusqu'au bridge. Le bridge ajoute PC B à sa table, toujours sur le segment 1.
            active: [pc-b, hub-1, bridge]
            packets:
              - - from: pc-b
                  to: hub-1
              - - from: hub-1
                  to: bridge
                  keep: true
                - from: hub-1
                  to: pc-a
                  keep: true
            table:
              headers: [Adresse MAC, Segment]
              rows:
                - ["PC A", "Segment 1"]
                - ["PC B", "Segment 1"]
                - ["-", "-"]
                - ["-", "-"]

          - title: PC C émet depuis l'autre segment vers PC A
            panel: Apprentissage - PC C sur le segment 2
            description: PC C émet une trame. Elle traverse le hub 2 puis atteint le bridge par l'autre port. Le bridge apprend que PC C se trouve sur le segment 2.
            active: [pc-c, hub-2, bridge]
            packets:
              - - from: pc-c
                  to: hub-2
              - - from: hub-2
                  to: bridge
                - from: hub-2
                  to: pc-d
                  keep: true
              - - from: bridge
                  to: hub-1
              - - from: hub-1
                  to: pc-a
                  keep: true
                - from: hub-1
                  to: pc-b
                  keep: true
            table:
              headers: [Adresse MAC, Segment]
              rows:
                - ["PC A", "Segment 1"]
                - ["PC B", "Segment 1"]
                - ["PC C", "Segment 2"]
                - ["-", "-"]

          - title: PC D complète la table vers PC C
            panel: Table complète
            description: PC D émet une trame relayée par le hub 2. Le bridge connaît désormais la position de chaque appareil sur les deux segments.
            active: [pc-d, hub-2, bridge]
            packets:
              - - from: pc-d
                  to: hub-2
              - - from: hub-2
                  to: bridge
                  keep: true
                - from: hub-2
                  to: pc-c
                  keep: true
            table:
              headers: [Adresse MAC, Segment]
              rows:
                - ["PC A", "Segment 1"]
                - ["PC B", "Segment 1"]
                - ["PC C", "Segment 2"]
                - ["PC D", "Segment 2"]


