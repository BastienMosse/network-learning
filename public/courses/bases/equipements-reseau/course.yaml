  # ============================================================
  # 04 - LE SWITCH
  # ============================================================

  - id: switch
    title: Le Switch
    kicker: 04 / Couche 2
    blocks:

      - type: text
        title: Définition
        content: |
          Un **switch**, ou commutateur, permet de connecter plusieurs appareils au sein d'un même réseau local (**LAN**).

          Il peut être considéré comme un **bridge avec de nombreux ports**, conçu pour être beaucoup plus performant et évolutif.

      - type: text
        title: La table MAC
        content: |
          Le switch apprend les adresses MAC des appareils connectés à ses ports.

          Il construit une **table MAC**, par exemple :

          - AA:AA:AA → Port 1
          - BB:BB:BB → Port 2
          - CC:CC:CC → Port 3
          - DD:DD:DD → Port 4

          Lorsqu'une trame arrive, le switch regarde l'adresse MAC de destination et consulte sa table pour savoir sur quel port l'envoyer.
          Puis il redirige la trame uniquement vers le port correspondant, sans la diffuser vers tous les autres ports.

      - type: text
        title: Caractéristiques
        content: |
          - Fonctionne principalement en **couche 2 - Liaison de données**
          - Utilise les **adresses MAC**
          - Connecte plusieurs appareils dans un **LAN**
          - Utilise une **table MAC**
          - Transmet les trames vers le port approprié
          - Remplace aujourd'hui les hubs dans la grande majorité des réseaux Ethernet

          À retenir : **SWITCH = choisit le bon port grâce à la MAC**


      - type: demo
        title: Le switch apprend les adresses MAC
        intro: Trois PC envoient des trames l'un après l'autre.
        network:
          nodes:
            - id: pc-a
              label: PC A
              kind: device
              position: { x: 25, y: 70 }
            - id: pc-b
              label: PC B
              kind: device
              position: { x: 50, y: 70 }
            - id: pc-c
              label: PC C
              kind: device
              position: { x: 75, y: 70 }
            - id: switch
              label: Switch
              kind: device
              position: { x: 50, y: 20 }
          connections:
            - from: pc-a
              to: switch
            - from: pc-b
              to: switch
            - from: pc-c
              to: switch
          segments:
            - id: segment-1
              label: Segment 1
              x: 10.5
              y: 45
              width: 25
              height: 45
              color: teal
            - id: segment-2
              label: Segment 2
              x: 38
              y: 45
              width: 25
              height: 45
              color: coral
            - id: segment-3
              label: Segment 3
              x: 65.5
              y: 45
              width: 25
              height: 45
              color: green
        steps:
          - title: La table MAC est vide
            panel: Table MAC
            description: Au démarrage, le switch ne connaît aucune correspondance entre adresses MAC et ports.
            active: [switch]
            table:
              headers: [Adresse MAC, Port]
              rows: 
                - ["-", "-"]
                - ["-", "-"]
                - ["-", "-"]

          - title: PC A envoie une trame
            panel: Apprentissage du port 1
            description: PC A envoie une trame sur le port 1. Le switch note que l'adresse MAC de PC A se trouve sur le port 1, puis diffuse la trame car il ne connaît pas encore le destinataire.
            active: [pc-a, switch]
            packets:
              - - from: pc-a
                  to: switch
              - - from: switch
                  to: pc-b
                  keep: true
                - from: switch
                  to: pc-c
                  keep: true
            table:
              headers: [Adresse MAC, Port]
              rows:
                - ["AA:AA:AA:AA:AA:01", 1]
                - ["-", "-"]
                - ["-", "-"]

          - title: PC B répond
            panel: Apprentissage du port 2
            description: PC B répond depuis le port 2. Le switch apprend aussi cette adresse. Comme il connaît déjà le port de PC A, il transmet la trame directement, sans la diffuser.
            active: [pc-b, switch, pc-a]
            packets:
              - - from: pc-b
                  to: switch
              - - from: switch
                  to: pc-a
                  keep: true
            table:
              headers: [Adresse MAC, Port]
              rows:
                - ["AA:AA:AA:AA:AA:01", 1]
                - ["BB:BB:BB:BB:BB:02", 2]
                - ["-", "-"]

          - title: PC C envoie une trame à son tour
            panel: Apprentissage du port 3
            description: PC C, sur le port 3, envoie une trame. Le switch complète sa table avec cette troisième correspondance.
            active: [pc-c, switch]
            packets:
              - - from: pc-c
                  to: switch
            table:
              headers: [Adresse MAC, Port]
              rows:
                - ["AA:AA:AA:AA:AA:01", 1]
                - ["BB:BB:BB:BB:BB:02", 2]
                - ["CC:CC:CC:CC:CC:03", 3]

          - title: La table MAC est maintenant complète
            panel: Table MAC finale
            description: Le switch connaît la position de chaque appareil et peut transmettre toutes les trames directement au bon port, sans diffusion inutile.
            active: [switch]
            table:
              headers: [Adresse MAC, Port]
              rows:
                - ["AA:AA:AA:AA:AA:01", 1]
                - ["BB:BB:BB:BB:BB:02", 2]
                - ["CC:CC:CC:CC:CC:03", 3]

  # ============================================================
  # 05 - LE ROUTEUR
  # ============================================================

  - id: routeur
    title: Le Routeur
    kicker: 05 / Couche 3
    blocks:

      - type: text
        title: Définition
        content: |
          Un **routeur** permet de **relier plusieurs réseaux différents**.

          Contrairement au switch, qui connecte principalement des appareils au sein d'un même réseau local, le routeur permet de faire communiquer des réseaux IP différents.

          Exemple :

          Réseau A : 192.168.1.0/24
                    │
                 ROUTEUR
                    │
          Réseau B : 192.168.2.0/24

      - type: text
        title: Le rôle des adresses IP
        content: |
          Le routeur utilise principalement les **adresses IP** pour déterminer où envoyer les paquets.

          Si un ordinateur possède l'adresse :

          192.168.1.10

          et souhaite communiquer avec :

          192.168.2.20

          le routeur constate que la destination appartient à un autre réseau.
          Il transmet alors le paquet vers l'interface permettant d'atteindre le réseau 192.168.2.0/24.

      - type: text
        title: La table de routage
        content: |
          Le routeur possède une **table de routage**.

          Cette table contient des informations permettant de déterminer par quelle interface ou quelle passerelle un paquet doit être envoyé pour atteindre un réseau donné.

          Le routeur cherche donc essentiellement :

          **« Quel chemin dois-je utiliser pour atteindre ce réseau ? »**

      - type: text
        title: Caractéristiques
        content: |
          - Fonctionne principalement en **couche 3 - Réseau**
          - Utilise les **adresses IP**
          - Relie différents réseaux
          - Utilise une **table de routage**
          - Transmet des **paquets IP**
          - Permet notamment de relier un réseau local à Internet

          À retenir : **ROUTEUR = choisit le chemin entre les réseaux**


      - type: demo
        title: Le routeur choisit le chemin
        intro: PC A (réseau 192.168.1.0/24) veut joindre PC B (réseau 192.168.2.0/24).
        network:
          nodes:
            - id: pc-a
              label: PC A
              kind: device
            - id: routeur
              label: Routeur
              kind: device
            - id: pc-b
              label: PC B
              kind: service
          connections:
            - from: pc-a
              to: routeur
            - from: pc-b
              to: routeur
        steps:
          - title: PC A prépare le paquet
            panel: Destination hors du réseau local
            description: PC A, à l'adresse 192.168.1.10, veut envoyer un paquet à 192.168.2.20. Il constate que cette adresse n'appartient pas à son propre réseau et envoie le paquet à sa passerelle, le routeur.
            active: [pc-a]

          - title: Le routeur reçoit le paquet
            panel: Paquet reçu sur eth0
            description: Le routeur reçoit le paquet sur son interface eth0, reliée au réseau de PC A.
            active: [pc-a, routeur]
            packets:
              - - from: pc-a
                  to: routeur
                  keep: true

          - title: Le routeur consulte sa table de routage
            panel: Table de routage
            description: "Le routeur regarde l'adresse IP de destination, 192.168.2.20, et cherche par quelle interface ce réseau est accessible."
            active: [routeur]
            table:
              headers: [Réseau destination, Interface]
              rows:
                - ["192.168.1.0/24", "eth0"]
                - ["192.168.2.0/24", "eth1"]

          - title: Le routeur transmet vers eth1
            panel: Paquet transmis via eth1
            description: Le réseau 192.168.2.0/24 est accessible par l'interface eth1. Le routeur y transmet le paquet.
            active: [routeur, pc-b]
            packets:
              - - from: routeur
                  to: pc-b
                  keep: true

          - title: PC B reçoit le paquet
            panel: Paquet livré
            description: PC B reçoit le paquet. Sans le routeur, PC A n'aurait eu aucun moyen d'atteindre un appareil situé sur un autre réseau.
            active: [pc-b]

  # ============================================================
  # 06 - MAC VS IP
  # ============================================================

  - id: mac-ip
    title: Adresse MAC et adresse IP
    kicker: 06 / Notion essentielle
    blocks:

      - type: text
        title: L'adresse MAC
        content: |
          Une **adresse MAC** identifie une interface réseau au niveau de la couche Liaison de données.

          Exemple :

          AA:BB:CC:DD:EE:FF

          Elle est principalement utilisée par les **switches et les bridges** pour déterminer vers quelle interface transmettre une trame.

          Une adresse MAC est essentiellement un identifiant d'interface : elle ne contient pas d'information hiérarchique permettant de déterminer à quel réseau appartient la machine.

          **MAC → couche 2 → trame → switch / bridge**

      - type: text
        title: L'adresse IP
        content: |
          Une **adresse IP** identifie une interface dans un réseau IP.

          Contrairement à une adresse MAC, une adresse IP est **hiérarchique** : elle permet, avec son masque ou son préfixe, de déterminer à quel **réseau ou sous-réseau** appartient l'interface.

          Exemple :

          192.168.1.25/24

          Ici :

          - **192.168.1.0/24** → réseau
          - **192.168.1.25** → adresse de l'interface dans ce réseau

          Cette organisation hiérarchique permet aux routeurs de regrouper plusieurs adresses et réseaux dans des **préfixes**, ce qui rend possible l'agrégation des routes et permet de faire fonctionner Internet à grande échelle.

          Les adresses IP sont principalement utilisées par les **routeurs** pour déterminer vers quel réseau transmettre un paquet.

          **IP → couche 3 → paquet → routeur**

      - type: text
        title: La différence fondamentale
        content: |
          Un switch se demande principalement :

          **« Sur quel port se trouve cette adresse MAC ? »**

          Un routeur se demande principalement :

          **« Vers quel réseau dois-je envoyer ce paquet IP ? »**

          En résumé :

          - **MAC → identifie une interface sur le réseau local**
          - **IP → permet de situer une interface dans une hiérarchie de réseaux**

  # ============================================================
  # 07 - COMPARAISON
  # ============================================================

  - id: comparaison
    title: Comparer les quatre équipements
    kicker: 07 / Synthèse technique
    blocks:
      - type: text
        title: Tableau de comparaison
        content: |
          Le **hub** fonctionne en **couche 1** du modèle OSI. Il ne travaille pas avec des adresses réseau et se contente de répéter les signaux reçus vers les autres ports.
          
          Le **bridge** fonctionne en **couche 2**. Il utilise les **adresses MAC** pour relier et filtrer les trames entre différents segments du réseau.
          
          Le **switch** fonctionne également en **couche 2** et utilise les **adresses MAC**. Il permet de connecter plusieurs appareils au sein d'un même **LAN** et transmet les trames vers le port approprié.
          
          Le **routeur** fonctionne en **couche 3** et utilise les **adresses IP**. Il permet de relier différents réseaux et détermine vers quel réseau transmettre les paquets.

      - type: text
        title: Le chemin typique
        content: |
          Dans un réseau domestique ou d'entreprise, on peut retrouver plusieurs équipements :

          PC → SWITCH → ROUTEUR → INTERNET

          Le **switch** permet aux appareils du réseau local de communiquer.
          Le **routeur** permet au réseau local de communiquer avec d'autres réseaux.

  # ============================================================
  # 08 - SYNTHÈSE
  # ============================================================

  - id: conclusion
    title: À retenir
    kicker: 08 / Synthèse
    blocks:

      - type: text
        title: Le repère simple
        content: |
          - **Hub** → couche 1 → répète les signaux partout
          - **Bridge** → couche 2 → filtre les trames grâce aux MAC
          - **Switch** → couche 2 → utilise les MAC pour choisir le bon port
          - **Routeur** → couche 3 → utilise les IP pour choisir le bon chemin

          Le repère essentiel :

          **Hub → 1**
          **Bridge / Switch → 2**
          **Routeur → 3**

      - type: text
        title: La phrase à retenir
        content: |
          Un **switch** permet principalement de connecter des appareils dans un même réseau grâce aux **adresses MAC**, tandis qu'un **routeur** permet de relier des réseaux différents grâce aux **adresses IP**.

          Le **hub** est un équipement simple qui répète les signaux partout, tandis que le **bridge** filtre les trames entre différents segments d'un réseau.
