id: ethernet-training
slug: ethernet-training
title: Training — Ethernet
description: Exercice de synthèse permettant de mobiliser les notions de trame Ethernet, adresses MAC, table MAC, domaines de collision et de broadcast, ainsi que les couches du modèle OSI.
level: Débutant
duration: 15 min
themeId: ethernet
color: blue

objectives:
  - Identifier les domaines de collision dans une topologie
  - Identifier les domaines de broadcast dans une topologie
  - Construire une table MAC à partir de trames reçues par un switch
  - Identifier la couche OSI principale de chaque équipement
  - Distinguer les rôles du hub, du bridge, du switch et du routeur
  - Comprendre le chemin d'une trame Ethernet dans un réseau local

